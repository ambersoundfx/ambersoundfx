<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amber Sound FX — Pedales Artesanales</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --cream: #FAF7F2;
      --amber: #C8860A;
      --amber-light: #E8A020;
      --amber-pale: #FDF0D5;
      --dark: #1A1410;
      --mid: #6B5A45;
      --light-mid: #B8A898;
      --border: #E2D5C0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--cream);
      color: var(--dark);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: 0.4;
    }

    /* HEADER */
    header {
      padding: 48px 60px 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      animation: fadeDown 0.8s ease both;
      position: sticky;
      top: 0;
      background: rgba(250, 247, 242, 0.95);
      backdrop-filter: blur(8px);
      z-index: 50;
    }

    .logo-tag {
      font-size: 10px;
      letter-spacing: 0.25em;
      color: var(--amber);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--dark);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .logo span {
      color: var(--amber);
      font-style: italic;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    nav a {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--mid);
      text-decoration: none;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--amber);
    }

    .ig-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--dark);
      color: var(--cream) !important;
      padding: 10px 18px;
      border-radius: 2px;
      font-size: 11px !important;
      letter-spacing: 0.12em;
      transition: background 0.2s !important;
    }

    .ig-btn:hover {
      background: var(--amber) !important;
    }

    .ig-icon {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    /* HERO */
    .hero {
      position: relative;
      width: 100%;
      min-height: 580px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      animation: fadeUp 1s ease 0.2s both;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-color: var(--amber-pale);
      background-image: url('hero.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.65) 0%, rgba(0, 0, 0, 0.3) 60%, rgba(0, 0, 0, 0.05) 100%);
      z-index: 1;
    }

    .hero-text {
      position: relative;
      z-index: 2;
      padding: 80px 60px;
      max-width: 640px;
    }

    .hero-label {
      display: inline-block;
      font-size: 9px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 20px;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: 58px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .hero-title em {
      font-style: italic;
      color: #ffffff;
    }

    .hero-desc {
      font-size: 14px;
      line-height: 1.75;
      color: rgba(255, 255, 255, 0.75);
      max-width: 440px;
      margin-bottom: 36px;
      font-weight: 300;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: white;
      color: var(--dark);
      text-decoration: none;
      padding: 14px 32px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: background 0.2s, transform 0.2s;
    }

    .hero-cta:hover {
      background: var(--amber);
      color: white;
      transform: translateY(-1px);
    }

    /* DIVIDER */
    .divider {
      padding: 0 60px;
      margin: 20px 0;
    }

    .divider-line {
      height: 1px;
      background: var(--border);
      position: relative;
    }

    .divider-line::before {
      content: '◆';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: var(--cream);
      padding: 0 16px;
      color: var(--amber);
      font-size: 10px;
    }

    /* CATEGORY TABS */
    .tabs-wrapper {
      padding: 0 60px;
      margin-bottom: 48px;
      animation: fadeUp 1s ease 0.3s both;
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      padding: 14px 24px;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--light-mid);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: 'DM Mono', monospace;
    }

    .tab:hover {
      color: var(--mid);
    }

    .tab.active {
      color: var(--amber);
      border-bottom-color: var(--amber);
    }

    /* PEDALS SECTION */
    .section {
      padding: 0 60px 80px;
      animation: fadeUp 1s ease 0.4s both;
    }

    .category-section {
      display: none;
    }

    .category-section.active {
      display: block;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 32px;
      padding-top: 48px;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .section-title em {
      font-style: italic;
      color: var(--amber);
    }

    .section-count {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--light-mid);
      text-transform: uppercase;
    }

    /* PEDAL GRID */
    .pedal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .pedal-card {
      background: var(--cream);
      cursor: pointer;
      transition: transform 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .pedal-card:hover {
      z-index: 2;
      transform: scale(1.02);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
    }

    /* CAROUSEL */
    .carousel {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--amber-pale);
    }

    .carousel-track {
      display: flex;
      height: 100%;
      transition: transform 0.4s ease;
    }

    .carousel-slide {
      min-width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--amber-pale);
      transition: transform 0.4s ease;
    }

    .pedal-card:hover .carousel-slide img {
      transform: scale(1.05);
    }

    .carousel-slide-placeholder {
      text-align: center;
      color: var(--light-mid);
    }

    .carousel-slide-placeholder svg {
      width: 48px;
      height: 48px;
      opacity: 0.3;
      margin-bottom: 8px;
    }

    .carousel-slide-placeholder span {
      display: block;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(26, 20, 16, 0.6);
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 5;
    }

    .carousel:hover .carousel-btn {
      opacity: 1;
    }

    .carousel-btn.prev {
      left: 8px;
    }

    .carousel-btn.next {
      right: 8px;
    }

    .carousel-btn:hover {
      background: var(--amber);
    }

    .carousel-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      z-index: 5;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: background 0.2s;
    }

    .dot.active {
      background: var(--amber);
    }

    .available-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--amber);
      color: white;
      font-size: 9px;
      letter-spacing:
