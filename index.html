<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amber Sound FX — Pedales Artesanales</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* === TU CSS ORIGINAL (recortado mínimamente) === */
:root { --cream:#FAF7F2; --amber:#C8860A; --amber-light:#E8A020; --amber-pale:#FDF0D5; --dark:#1A1410; --mid:#6B5A45; --light-mid:#B8A898; --border:#E2D5C0; }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);color:var(--dark);font-family:'DM Mono',monospace}
header{padding:48px 60px 32px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)}
.logo{font-family:'Playfair Display',serif;font-size:36px;font-weight:700}
nav a{margin-left:20px;text-decoration:none;color:var(--mid)}

/* === NUEVO: FILTROS === */
.filters{padding:20px 60px;display:flex;gap:10px}
.filters button{background:none;border:1px solid var(--border);padding:8px 12px;cursor:pointer}
.filters button:hover{border-color:var(--amber);color:var(--amber)}

/* === GRID ORIGINAL === */
.pedal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 60px;border:1px solid var(--border)}
.pedal-card{background:var(--cream);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.pedal-img img{width:100%;height:220px;object-fit:cover}
.pedal-info{padding:20px}

/* === NUEVO: GALERÍA === */
.thumbs{display:flex;gap:4px;padding:6px}
.thumbs img{width:32%;cursor:pointer;opacity:0.6}
.thumbs img:hover{opacity:1}

.category-title{font-family:'Playfair Display',serif;font-size:26px;margin:40px 60px 10px}
</style>
</head>
<body>

<header>
  <div class="logo">Amber Sound FX</div>
  <nav>
    <a href="#pedales">Pedales</a>
  </nav>
</header>

<!-- FILTROS -->
<div class="filters">
  <button onclick="filter('all')">Todos</button>
  <button onclick="filter('fuzz')">Fuzz</button>
  <button onclick="filter('od')">Overdrive</button>
  <button onclick="filter('mod')">Modulación</button>
</div>

<!-- CATEGORIA 1 -->
<h2 class="category-title">Fuzz & Overdrives</h2>
<div class="pedal-grid">

<!-- PEDAL CON GALERÍA -->
<div class="pedal-card" data-type="fuzz">
  <div class="pedal-img">
    <img id="img1" src="space-bender.jpg">
    <div class="thumbs">
      <img src="space-bender.jpg" onclick="changeImg('img1', this.src)">
      <img src="space-bender-2.jpg" onclick="changeImg('img1', this.src)">
      <img src="space-bender-3.jpg" onclick="changeImg('img1', this.src)">
    </div>
  </div>
  <div class="pedal-info">
    <strong>Space Bender</strong>
  </div>
</div>

<!-- OTRO PEDAL -->
<div class="pedal-card" data-type="od">
  <div class="pedal-img">
    <img id="img2" src="plumes.jpg">
    <div class="thumbs">
      <img src="plumes.jpg" onclick="changeImg('img2', this.src)">
      <img src="plumes-2.jpg" onclick="changeImg('img2', this.src)">
    </div>
  </div>
  <div class="pedal-info">
    <strong>Clon Plumes</strong>
  </div>
</div>

</div>

<!-- CATEGORIA 2 -->
<h2 class="category-title">Modulación</h2>
<div class="pedal-grid">
<div class="pedal-card" data-type="mod">
  <div class="pedal-info">Próximamente</div>
</div>
</div>

<script>
function changeImg(id, src){ document.getElementById(id).src = src; }
function filter(type){
 document.querySelectorAll('.pedal-card').forEach(card=>{
  if(type==='all'||card.dataset.type===type){ card.style.display='block'; }
  else{ card.style.display='none'; }
 });
}
</script>

</body>
</html>
